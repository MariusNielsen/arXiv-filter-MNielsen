name: daily filter

on:
  schedule:
    # arXiv announces at 00:00 UTC (20:00 New York), Sunday-Thursday nights, so Mon-Fri mornings
    # have new listings. GitHub sometimes delays or silently drops scheduled runs, so there are
    # backups; runs are idempotent (a later run the same day merges into that day's page).
    # Odd minutes avoid the top-of-hour congestion. Times in UTC (Berlin = UTC+2 summer / +1 winter).
    - cron: "17 4 * * *"
    - cron: "43 5 * * *"
    - cron: "11 7 * * *"
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | backtest | citers"
        default: daily
      days:
        description: "backtest window in days"
        default: "90"

permissions:
  contents: write

concurrency:
  group: filter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Daily run
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        run: python arxiv_filter.py

      - name: Backtest
        if: inputs.mode == 'backtest'
        run: python arxiv_filter.py --backtest "${{ inputs.days }}"

      - name: Refresh citers
        if: inputs.mode == 'citers'
        run: python arxiv_filter.py --refresh-citers

      - name: Commit results
        run: |
          git config user.name "arxiv-filter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs state citers_suggested.yaml 2>/dev/null || git add -A docs state
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
