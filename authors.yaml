# Author watchlist for the arXiv filter.
# Matching: compare normalized (diacritics stripped, lowercase) "first last" against
# each variant. Match on FULL names, not surname + initial: several of these surnames
# are shared with active authors in math.RT/math.AG (Henning Krause, other Wilsons, Hahns, Xus...).
#
# tier: always  -> shown at the top every time
# tier: watch   -> shown at the top only if the paper also lands in your categories
#                  or hits a keyword (cheap way to keep low-signal names without noise)
# '# cited' marks authors cited in your filtered-stacks paper (from master.aux)

always:
