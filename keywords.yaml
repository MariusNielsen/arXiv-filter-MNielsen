# Patterns are Python regular expressions, matched case-insensitively against a
# normalized form of title/abstract:
#   - lowercase, accents stripped (Pstrągowski -> pstragowski)
#   - TeX commands removed (\mathrm{Syn}_E -> syn_e, $K(n)$-local -> k(n)-local)
#   - all dashes (-, --, en/em dash) become "-"
# Use stems rather than listing inflections. \b is a word boundary.

# Strong: specific enough to count anywhere in title or abstract.
strong:
  # synthetic / filtered / deformations
  - synthetic spectr
  - \bsyn_e\b
  - synthetic (analogue|deformation|adams|category)
  - filtered (spectr|stack|ring spectr|e_?infinity)
  - \bdescendab
  - nilpotence exponent
  - nilpotent(ly)? complet
  - descent spectral sequence
  # Adams-type spectral sequences, chromatic
  - adams[- ]novikov
  - adams spectral sequence
  - chromatic (homotopy|splitting|convergence|redshift|nullstellensatz)
  - morava [ek][- ]theor
  - \b[ekt]\([^)]{1,5}\)[- ](local|theor|homolog)
  - lubin[- ]tate
  - \bcomodules?\b
  - \bfranke
  - telescope conjecture
  # trace methods / prismatic
  - topological (hochschild|cyclic|restriction) homology
  - \bthh\b
  - prismatic
  - \bprisms?\b
  - even filtration
  - motivic filtration
  - cyclotomic spectr
  - \bcyclonic
  - polygonic
  # spectral algebraic geometry / stacks
  - dirac geometr
  - spectral (algebraic geometry|stack|scheme)
  - moduli (stack )?of (oriented )?formal groups
  - even periodi
  # classical stable homotopy
  - stable (homotopy )?stems?
  - hopf invariant
  - kervaire
  - adams (conjecture|operation)
  - \bj-homomorphism|image of j\b
  - ring spectr
  - goerss[- ]hopkins
  - brown[- ]comenetz|anderson dual
  - syntomic
  # equivariant / global homotopy
  - mackey functor
  - genuine (equivariant|[a-z]-spectr|[a-z]-)
  - \b[gc]_?[a-z0-9]*-spectr
  - global (homotopy|spectr|infinity)
  # infinity-categories / higher algebra (\infty and ∞ both normalize to "infinity")
  - infinity[- ]?(categor|operad|topo|groupoid|cosmo)
  - \(infinity, ?[0-9n]\)
  - higher (categor|algebra|topos|operad)
  - presentabl[ey]
  - (co)?cartesian fibration
  - straightening
  - (complete )?segal (space|categor|condition)
  - quasi-?categor
  - (op)?lax (co)?limit
  - \bpr\^[lr]\b
  - \be_(infinity|[0-9nk]|k\+1|n\+1)[- ](ring|algebra|operad|monoidal)
  - goodwillie
  - condensed (spectr|anima|math|set)
  - pyknotic
  # tt-geometry, exact categories (your papers)
  - tensor[- ]triangulat
  - \btt[- ]geometr
  - balmer spectr
  - smashing spectr
  - stable envelope
  - hopfological
  - presentable stable
  # sheaves of spaces
  - sheaves of (spaces|anima)
  - (infinity|∞)?[- ]?topoi\b

# Title only: too common in abstracts to be useful there.
title_only:
  - \bmotivic\b
  - \bdescent\b
  - stable homotopy
  - spectral sequence
  - trace method
  - \bnilpoten
  - exact (infinity[- ])?categor
  - \btopos\b
  - \btc\b
  - six[- ]functor
  - obstruction theor
  - \bredshift\b
  - t[- ]structure
  - \bpicard
  - equivariant
  - algebraicity
